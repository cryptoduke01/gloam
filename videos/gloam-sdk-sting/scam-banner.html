<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family:"Aeonik"; src:url("./fonts/Aeonik-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
  @font-face { font-family:"Aeonik"; src:url("./fonts/Aeonik-Medium.woff2") format("woff2"); font-weight:500; font-display:block; }
  @font-face { font-family:"Aeonik"; src:url("./fonts/Aeonik-Bold.woff2") format("woff2"); font-weight:700; font-display:block; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:900px; overflow:hidden; }
  body {
    font-family:"Aeonik", system-ui, sans-serif;
    background:#0a0a0d;
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  /* subtle twilight-indigo glow rising from the bottom */
  .glow {
    position:absolute; inset:0;
    background:radial-gradient(58% 46% at 50% 108%, rgba(76,71,138,.55) 0%, rgba(59,55,102,.22) 34%, transparent 68%);
  }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 42%, #000 0%, transparent 78%);
            mask-image:radial-gradient(70% 60% at 50% 42%, #000 0%, transparent 78%);
  }
  .card { position:relative; text-align:center; padding:0 120px; }
  .mark { margin:0 auto 40px; width:52px; height:52px; display:block; }
  h1 { color:#f6f5f2; font-size:60px; line-height:1.05; letter-spacing:-.035em; font-weight:700; }
  .sub { margin:30px auto 0; max-width:44ch; color:#9b99a4; font-size:26px; line-height:1.5; font-weight:400; }
  .foot { margin-top:56px; display:inline-flex; align-items:center; gap:11px; color:#b7b5bf; font-size:22px; font-weight:500; letter-spacing:.01em; }
  .foot .dot { width:9px; height:9px; border-radius:50%; background:#a29ce0; box-shadow:0 0 12px 1px rgba(162,156,224,.7); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="card">
    <svg class="mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1.1" y="1.1" width="29.8" height="29.8" rx="8.4" stroke="#8f8d99" stroke-width="1.7"/>
      <rect x="15" y="4" width="12" height="12" rx="3.5" fill="#8f8d99"/>
    </svg>
    <h1>This is the last message in this thread</h1>
    <p class="sub">Anyone messaging you beyond this claiming to be Gloam is a scam. We will never DM you first, ask for your keys, or send you a link to connect.</p>
    <div class="foot"><span class="dot"></span> gloam.trade</div>
  </div>
</body>
</html>
