<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gloam email signature</title>
</head>
<body style="margin:0;padding:40px;background:#FFFFFF;">
<!--
  Gloam email signature.
  1. Change the name, role and links below.
  2. Open this file in a browser, select the signature, copy it.
  3. Paste it into your mail app's signature settings (Gmail, Apple Mail, Outlook).
  Mail apps rarely carry custom fonts, so Aeonik falls back to Helvetica or Arial.
  The mark loads from gloam.trade. Keep the layout: mark, hairline, four short lines.
-->
<!-- signature:start -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Aeonik,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#0B0C0E;">
  <tr>
    <td valign="top" style="padding:2px 16px 0 0;">
      <img src="https://gloam.trade/brand/kit/email/gloam-mark-email.png" width="36" height="36" alt="Gloam" style="display:block;border:0;width:36px;height:36px;">
    </td>
    <td valign="top" style="border-left:1px solid #E4E6E9;padding:0 0 0 16px;">
      <div style="font-size:15px;line-height:20px;font-weight:500;color:#0B0C0E;">Your Name</div>
      <div style="font-size:13px;line-height:19px;color:#5F636A;">Your role, Gloam</div>
      <div style="font-size:13px;line-height:19px;color:#5F636A;padding-top:10px;">Private money on public chains.</div>
      <div style="font-size:13px;line-height:19px;padding-top:2px;">
        <a href="https://gloam.trade" style="color:#0B0C0E;text-decoration:none;">gloam.trade</a>
        <span style="color:#CFD2D6;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
        <a href="https://x.com/gloamtrade" style="color:#0B0C0E;text-decoration:none;">@gloamtrade</a>
      </div>
    </td>
  </tr>
</table>
<!-- signature:end -->
</body>
</html>
