<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gloam — Testnet banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/overused-grotesk" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2400px;
      height: 1350px;
      overflow: hidden;
      background: #000;
    }

    .frame {
      position: relative;
      width: 2400px;
      height: 1350px;
      background: #000;
      color: #fff;
      font-family: "Overused Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .amb-r {
      position: absolute;
      right: -80px;
      top: 40%;
      width: 1100px;
      height: 1100px;
      transform: translateY(-50%);
      background: radial-gradient(circle, rgba(200, 255, 0, 0.12) 0%, rgba(200, 255, 0, 0.03) 45%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Art as atmospheric right field, not a hard panel */
    .art {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 58%;
      z-index: 1;
    }
    .art-img {
      position: absolute;
      inset: 0;
      background: #000 url("hero.png") 55% center / cover no-repeat;
      filter: contrast(1.08) brightness(1.06);
    }
    .art-lime {
      position: absolute;
      inset: 0;
      background: #c8ff00;
      mix-blend-mode: multiply;
      opacity: 0.7;
    }
    .art-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg,
          #000 0%,
          rgba(0,0,0,0.97) 12%,
          rgba(0,0,0,0.75) 28%,
          rgba(0,0,0,0.25) 48%,
          transparent 62%),
        linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.5) 100%);
    }

    .frame-line {
      position: absolute;
      inset: 48px;
      border: 1px solid rgba(200, 255, 0, 0.2);
      pointer-events: none;
      z-index: 5;
    }

    /* Full living space for type */
    .content {
      position: relative;
      z-index: 4;
      height: 100%;
      padding: 100px 100px 100px 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .brand img {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      display: block;
    }
    .brand-name {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 40px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .brand-tag {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #c8ff00;
    }

    .hero-block {
      max-width: 72%;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      align-self: flex-start;
      padding: 12px 20px;
      border: 1px solid rgba(200, 255, 0, 0.4);
      background: rgba(200, 255, 0, 0.07);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #c8ff00;
    }
    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c8ff00;
      box-shadow: 0 0 14px #c8ff00;
    }

    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 132px;
      line-height: 0.96;
      letter-spacing: -0.035em;
      color: #fff;
      max-width: none;
    }
    h1 .accent {
      font-style: italic;
      color: #c8ff00;
    }

    .lede {
      max-width: 22em;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.015em;
      color: #b0b0b0;
    }

    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 48px;
      max-width: 78%;
    }

    .meta-wrap {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .rule {
      width: 72px;
      height: 2px;
      background: #c8ff00;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px 40px;
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .meta-k {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #737373;
    }
    .meta-v {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #f5f5f5;
    }
    .meta-v em {
      font-style: normal;
      color: #c8ff00;
    }

    .foot {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #737373;
      flex-shrink: 0;
    }
    .foot .site {
      color: #c8ff00;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="amb-r"></div>
    <div class="frame-line"></div>

    <div class="art" aria-hidden="true">
      <div class="art-img"></div>
      <div class="art-lime"></div>
      <div class="art-scrim"></div>
    </div>

    <div class="content">
      <div class="brand">
        <img src="logo.png" alt="" width="56" height="56" />
        <div>
          <div class="brand-name">Gloam</div>
          <div class="brand-tag">Private money</div>
        </div>
      </div>

      <div class="hero-block">
        <div class="pill">
          <span class="pill-dot"></span>
          Coming soon
        </div>
        <h1>
          Testnet goes <span class="accent">live</span> soon
        </h1>
        <p class="lede">
          Private shield, send, and cash out. Ready when the clock hits zero.
        </p>
      </div>

      <div class="bottom">
        <div class="meta-wrap">
          <div class="rule"></div>
          <div class="meta">
            <div class="meta-item">
              <span class="meta-k">Opens</span>
              <span class="meta-v"><em>Thu 16 Jul</em> · 14:00 WAT</span>
            </div>
            <div class="meta-item">
              <span class="meta-k">App</span>
              <span class="meta-v">gloam.trade/app</span>
            </div>
          </div>
        </div>
        <div class="foot">
          <span>@gloamtrade</span>
          <span class="site">gloam.trade</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
