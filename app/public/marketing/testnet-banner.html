<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gloam — Testnet banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/overused-grotesk" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 2400px;
      height: 1350px;
      overflow: hidden;
      background: #000;
    }

    .frame {
      position: relative;
      width: 2400px;
      height: 1350px;
      background: #000;
      color: #fff;
      font-family: "Overused Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Ambient lime */
    .amb-r {
      position: absolute;
      right: -120px;
      top: 50%;
      width: 900px;
      height: 900px;
      transform: translateY(-50%);
      background: radial-gradient(circle, rgba(200, 255, 0, 0.11) 0%, rgba(200, 255, 0, 0.03) 42%, transparent 68%);
      pointer-events: none;
    }
    .amb-l {
      position: absolute;
      left: -160px;
      bottom: -200px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(200, 255, 0, 0.05) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Classic fine frame */
    .frame-line {
      position: absolute;
      inset: 56px;
      border: 1px solid rgba(200, 255, 0, 0.22);
      pointer-events: none;
      z-index: 4;
    }
    .frame-line-2 {
      position: absolute;
      inset: 72px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      pointer-events: none;
      z-index: 4;
    }

    /* Art column */
    .art {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 48%;
      z-index: 1;
    }
    .art-img {
      position: absolute;
      inset: 0;
      background: #000 url("hero.png") center / cover no-repeat;
      filter: contrast(1.1) brightness(1.08);
    }
    .art-lime {
      position: absolute;
      inset: 0;
      background: #c8ff00;
      mix-blend-mode: multiply;
      opacity: 0.72;
    }
    .art-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, #000 0%, rgba(0,0,0,0.88) 8%, rgba(0,0,0,0.2) 32%, transparent 48%),
        linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.55) 100%);
    }
    .art-divider {
      position: absolute;
      left: 0;
      top: 72px;
      bottom: 72px;
      width: 1px;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(200, 255, 0, 0.35) 20%,
        rgba(200, 255, 0, 0.35) 80%,
        transparent
      );
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      width: 54%;
      padding: 120px 80px 120px 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .brand img {
      width: 64px;
      height: 64px;
      border-radius: 6px;
      display: block;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .brand-name {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 42px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .brand-tag {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #c8ff00;
    }

    .mid {
      display: flex;
      flex-direction: column;
      gap: 36px;
      margin-top: -20px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      align-self: flex-start;
      padding: 12px 20px;
      border: 1px solid rgba(200, 255, 0, 0.4);
      background: rgba(200, 255, 0, 0.07);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #c8ff00;
    }
    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c8ff00;
      box-shadow: 0 0 14px #c8ff00;
    }

    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 118px;
      line-height: 0.98;
      letter-spacing: -0.03em;
      color: #fff;
    }
    h1 .line {
      display: block;
    }
    h1 .accent {
      font-style: italic;
      color: #c8ff00;
    }

    .lede {
      max-width: 18em;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      color: #a3a3a3;
    }

    .bottom {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .rule {
      width: 64px;
      height: 2px;
      background: #c8ff00;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .meta-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 16px;
      align-items: baseline;
      font-size: 18px;
      letter-spacing: 0.06em;
    }
    .meta-k {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #737373;
    }
    .meta-v {
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f5f5f5;
    }
    .meta-v em {
      font-style: normal;
      color: #c8ff00;
    }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #737373;
    }
    .foot .site {
      color: #c8ff00;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="amb-r"></div>
    <div class="amb-l"></div>
    <div class="frame-line"></div>
    <div class="frame-line-2"></div>

    <div class="art" aria-hidden="true">
      <div class="art-img"></div>
      <div class="art-lime"></div>
      <div class="art-scrim"></div>
      <div class="art-divider"></div>
    </div>

    <div class="content">
      <div class="brand">
        <img src="logo.png" alt="" width="64" height="64" />
        <div class="brand-text">
          <div class="brand-name">Gloam</div>
          <div class="brand-tag">Private money</div>
        </div>
      </div>

      <div class="mid">
        <div class="pill">
          <span class="pill-dot"></span>
          Coming soon
        </div>
        <h1>
          <span class="line">Testnet</span>
          <span class="line">goes <span class="accent">live</span></span>
          <span class="line">soon</span>
        </h1>
        <p class="lede">
          Private shield, send, and cash out — ready when the clock hits zero.
        </p>
      </div>

      <div class="bottom">
        <div class="rule"></div>
        <div class="meta">
          <div class="meta-row">
            <span class="meta-k">Opens</span>
            <span class="meta-v"><em>Thu 16 Jul</em> · 14:00 WAT</span>
          </div>
          <div class="meta-row">
            <span class="meta-k">Where</span>
            <span class="meta-v">gloam.trade/app</span>
          </div>
        </div>
        <div class="foot">
          <span>@gloamtrade</span>
          <span class="site">gloam.trade</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
