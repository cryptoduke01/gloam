packages:
  - "app"
  - "mcp"
  - "packages/*"
  - "examples/*"
  # contracts/ is Foundry (forge), not a pnpm package

# Security floors for transitive packages (pnpm audit --prod), each held to the
# major its parent asks for. Raise or drop a line once the parent ships the fix.
overrides:
  # @modelcontextprotocol/sdk -> express / ajv / express-rate-limit
  fast-uri@3: ^3.1.9
  proxy-addr@2: ^2.0.8
  body-parser@2: ^2.4.0
  qs@6: ^6.16.1
  ip-address@10: ^10.7.4
  # wagmi -> @metamask/sdk -> socket.io-client
  socket.io-parser@4: ^4.2.7
  # next -> postcss / styled-jsx
  nanoid@3: ^3.3.20
  source-map-js@1: ^1.2.2
  browserslist@4: ^4.29.4
  baseline-browser-mapping@2: ^2.11.32
  # @modelcontextprotocol/sdk, viem and ox (zod 4 only; zod 3 has no fixed release)
  zod@4: ^4.6.7
