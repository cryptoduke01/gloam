[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# shanghai: RH faucet tokens use PUSH0; paris sim hits NotActivated on balanceOf
evm_version = "shanghai"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
rh_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
