# Description
short_description: "Private stablecoin payments for GAME agents: a private balance, private payments, cash outs and proofs of funds on Base and Robinhood Chain, under per-asset spending limits."
detailed_description: "Gives a GAME agent a private balance in Gloam's shielded vault on Base or Robinhood Chain. The agent can add funds privately, pay a Gloam address, a payment request or a claim link without the amount or the parties going on chain, pick up payments sent to it, cash out to a public address, prove it holds at least an amount for one named reader, and check proofs others send it. Every payment is checked against limits the owner sets per asset (per payment and per rolling day, recipients, expiry), and no key, note secret or claim link ever reaches the planner. Works for ACP providers too: an ACP agent's smart wallet can be the sender (with a wallet policy that allows the vault), so its earnings go into its private balance without leaving the wallet first."

